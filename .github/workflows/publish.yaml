name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # OIDC — required
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm   # only if you configured this on npmjs.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # brings npm 11.5.1+ for trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # prepublishOnly runs n8n-node prerelease on publish
      - run: npm publish --access public