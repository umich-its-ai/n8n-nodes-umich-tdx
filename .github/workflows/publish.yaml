name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # OIDC — required
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: npm   # only if you configured this on npmjs.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # brings npm 11.5.1+ for trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # n8n-node blocks plain `npm publish` (prepublishOnly → prerelease).
      # In CI, `npm run release` runs lint, build, then publishes with provenance.
      - name: Publish to npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}