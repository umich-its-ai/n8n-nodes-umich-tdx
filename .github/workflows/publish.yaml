# Publishes to npm on version tag push with provenance (requires @n8n/node-cli >= 0.23.0).
#
# ONE-TIME npm setup (pick one):
#   A) Trusted Publishing (recommended): npmjs.com → package → Trusted Publishers
#      - Owner: umich-its-ai, Repo: n8n-nodes-umich-tdx
#      - Workflow filename: publish.yaml  (must match this file exactly)
#      - Leave NPM_TOKEN unset in GitHub
#   B) Token fallback: create npm granular token → GitHub secret NPM_TOKEN
#
# Local release (bumps version, tags, pushes — does NOT publish to npm):
#   npm run release

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Publish to npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
